<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video.js Centered Big Play Button + Custom Rose Color</title>

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/7.21.1/video-js.css" rel="stylesheet" />

  <!-- Video.js JS -->
  <script src="https://vjs.zencdn.net/7.21.1/video.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: black;
    }

    .video-js {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: black;
    }

    /* Center the big play button and play icon inside */
    .vjs-big-play-button {
   

      color: #e0d5d5 !important;        /* custom rose color */
      border-color: #e0d5d5 !important; /* custom rose border */
      box-shadow: 0 0 8px #e0d5d5;      /* subtle glow */
    }

    /* Control bar background */
    .vjs-control-bar {
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* Slider track */
    .vjs-slider {
      background-color: #e0d5d5; /* custom rose slider track */
    }

    /* Played progress on timeline */
    .vjs-play-progress {
      background-color: #e0d5d5 !important;
    }

    /* Volume level fill */
    .vjs-volume-level {
      background-color: #e0d5d5 !important;
    }

    /* Controls hover and focus color */
    .vjs-control:hover,
    .vjs-control:focus {
      color: #e0d5d5 !important;
    }
  </style>
</head>
<body>

  <video
    id="my-video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    autoplay
    data-setup="{}"
  >
    <source src="https://dl.dropboxusercontent.com/scl/fi/psvms5v9hgm9pnn1m73mw/Wedding2014.mp4?rlkey=0o0sf6xevcpwdko9apid6qdvq&dl=1" type="video/mp4" />
    Your browser does not support the video format mp4.
  </video>

</body>
</html>
